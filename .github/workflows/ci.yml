name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML files exist
        run: |
          echo "Checking repo structure..."
          ls -la

      - name: Lint HTML (optional)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
